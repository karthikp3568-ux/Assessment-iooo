<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssessX - Smart Online Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="auth-header">
                <div class="auth-logo">AssessX</div>
                <div class="auth-subtitle">Smart Online Assessment & Proctoring System</div>
            </div>

            <div id="alertMessage" class="alert hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username / Student ID</label>
                    <input type="text" id="username" class="form-control" required placeholder="Enter username">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter password">
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-4">Sign In</button>
            </form>

            <div class="text-center mt-4">
                <a href="register.html" class="auth-subtitle">Don't have an account? Register here</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
