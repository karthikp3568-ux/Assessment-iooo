<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssessX - Smart Online Assessment & Proctoring System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="auth-header">
                <div class="auth-logo">AssessX</div>
                <div class="auth-subtitle">Smart Online Assessment & AI Proctoring</div>
            </div>

            <div id="alertMessage" class="alert hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username / Student ID</label>
                    <input type="text" id="username" class="form-control" required placeholder="e.g. student or admin">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-3">Sign In</button>
            </form>

            <div class="quick-demo-box text-center">
                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem;">
                    Quick 1-Click Demo Login
                </div>
                <div class="flex gap-1">
                    <button type="button" id="quickStudentBtn" class="btn btn-outline btn-sm" style="flex: 1;">
                        🎓 Student Demo
                    </button>
                    <button type="button" id="quickAdminBtn" class="btn btn-outline btn-sm" style="flex: 1;">
                        🛡️ Admin Demo
                    </button>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="register.html" class="auth-subtitle">Don't have an account? <strong style="color: var(--primary);">Register here</strong></a>
            </div>

            <div class="text-center mt-3" style="font-size: 0.75rem; border-top: 1px dashed var(--border); padding-top: 0.75rem;">
                <button type="button" id="toggleServerSettingsBtn" style="background: transparent; border: none; font-size: 0.75rem; color: var(--text-muted); cursor: pointer; text-decoration: underline;">
                    ⚙️ Configure Backend Server URL
                </button>
                <div id="serverSettingsBox" class="hidden mt-2" style="background: #F8FAFC; border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.625rem; text-align: left;">
                    <label class="form-label" style="font-size: 0.7rem; margin-bottom: 0.25rem;">Backend API URL (Render/Railway):</label>
                    <div class="flex gap-1">
                        <input type="text" id="apiBaseUrlInput" class="form-control" style="font-size: 0.75rem; padding: 0.3rem 0.5rem;" placeholder="https://assessx-backend.onrender.com/api/v1">
                        <button type="button" id="saveApiUrlBtn" class="btn btn-primary btn-sm" style="font-size: 0.75rem; padding: 0.3rem 0.6rem;">Save</button>
                    </div>
                    <span id="apiUrlSaveMsg" class="hidden" style="font-size: 0.7rem; color: var(--secondary); margin-top: 0.25rem; display: block;">Saved! Reloading...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=3"></script>
    <script src="js/auth.js?v=3"></script>
    <script src="js/ux-enhance.js?v=1"></script>
</body>
</html>
