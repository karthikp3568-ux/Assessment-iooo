<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssessX - Smart Online Assessment & Proctoring System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="auth-header">
                <div class="auth-logo">AssessX</div>
                <div class="auth-subtitle">Smart Online Assessment & AI Proctoring</div>
            </div>

            <div id="alertMessage" class="alert hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username / Student ID</label>
                    <input type="text" id="username" class="form-control" required placeholder="e.g. student or admin">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-3">Sign In</button>
            </form>

            <div class="quick-demo-box text-center">
                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem;">
                    Quick 1-Click Demo Login
                </div>
                <div class="flex gap-1">
                    <button type="button" id="quickStudentBtn" class="btn btn-outline btn-sm" style="flex: 1;">
                        🎓 Student Demo
                    </button>
                    <button type="button" id="quickAdminBtn" class="btn btn-outline btn-sm" style="flex: 1;">
                        🛡️ Admin Demo
                    </button>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="register.html" class="auth-subtitle">Don't have an account? <strong style="color: var(--primary);">Register here</strong></a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
